[workspace]
members = [
    "taxel",
    "taxel-cli",
    "taxel-gui",
]
resolver = "2"

[workspace.package]
authors = ["quambene <contact.quambene@gmail.com>"]
edition = "2021"
version = "0.1.0"

[workspace.dependencies]
xbrl-rs = { version = "0.3.0", features = ["download"] }
eric-sdk = "0.6.0"
anyhow = "1.0.71"
log = "0.4.19"
env_logger = "0.10.0"
uuid = { version = "1", features = ["v4"] }
chrono = "0.4"
rust_decimal = "1"
serde = { version = "1.0.164", features = ["derive"] }
serde_json = "1"
quick-xml = "0.29.0"
roxmltree = "0.14.1"
csv = "1.2.2"
spreadsheet-ods = "0.22.0"
clap = { version = "3.2.14", default-features = false, features = ["std", "cargo"] }
dirs = "5"
trash = "3"
open = "5"
zip = "2"
reqwest = { version = "0.12", features = ["blocking"] }
eframe = { version = "0.34.1", features = ["persistence"] }
egui_extras = { version = "0.34.1", features = ["serde"] }
rfd = "0.17.2"
dioxus-devtools = "0.7.4"
